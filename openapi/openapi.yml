openapi: 3.1.0
info:
  title: Invoice Keeper API
  description: 'Напоминания о регулярных платежах. Авторизация: cookie-сессия (веб-панель) или `Authorization: Bearer <token>`
    — нажмите **Authorize** и введите логин/пароль.'
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - health
      summary: Состояние сервиса (БД и heartbeat worker)
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход по логину и паролю
      description: 'Устанавливает HttpOnly-cookie сессии и возвращает тот же токен для `Authorization: Bearer`.'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток
  /api/v1/auth/token:
    post:
      tags:
      - auth
      summary: Токен для кнопки Authorize в Swagger (OAuth2 password flow)
      operationId: token_api_v1_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_token_api_v1_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Слишком много попыток
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: 'Выход: сессия инвалидируется на сервере'
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/recurring-payments:
    get:
      tags:
      - recurring-payments
      summary: Список регулярных платежей
      operationId: list_payments_api_v1_recurring_payments_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          description: Показать и прекращённые платежи
          default: false
          title: Include Deleted
        description: Показать и прекращённые платежи
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringPaymentOut'
                title: Response List Payments Api V1 Recurring Payments Get
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - recurring-payments
      summary: Создать регулярный платёж (admin)
      description: Создаёт первый и следующий периоды. Если до срока ≤ REMINDER_DAYS_BEFORE дней, напоминание отправляется
        сразу.
      operationId: create_payment_api_v1_recurring_payments_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPaymentOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/recurring-payments/{payment_id}:
    delete:
      tags:
      - recurring-payments
      summary: 'Прекратить платёж (admin): история сохраняется, напоминаний больше нет'
      description: Soft delete. Будущие неоплаченные периоды удаляются, прошлые и оплаченные остаются с признаком `recurring_payment_deleted`.
        Повторный DELETE возвращает 404.
      operationId: delete_payment_api_v1_recurring_payments__payment_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Payment Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/payment-occurrences:
    get:
      tags:
      - payment-occurrences
      summary: Периоды платежей с фильтрами
      operationId: list_occurrences_api_v1_payment_occurrences_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
          description: paid | unpaid
          title: Status
        description: paid | unpaid
      - name: overdue
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Только просроченные (true) / без просрочки (false)
          title: Overdue
        description: Только просроченные (true) / без просрочки (false)
      - name: currency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          title: Currency
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не раньше (YYYY-MM-DD)
          title: From
        description: Срок не раньше (YYYY-MM-DD)
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок не позже (YYYY-MM-DD)
          title: To
        description: Срок не позже (YYYY-MM-DD)
      - name: recurring_payment_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Recurring Payment Id
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: Поиск по названию
          title: Q
        description: Поиск по названию
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - due_date
          - -due_date
          - amount
          - -amount
          - title
          - -title
          - paid_date
          - -paid_date
          - currency
          - -currency
          type: string
          default: due_date
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrencePage'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/payment-occurrences/{occurrence_id}:
    get:
      tags:
      - payment-occurrences
      summary: Период
      operationId: get_occurrence_api_v1_payment_occurrences__occurrence_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - payment-occurrences
      summary: Отметить оплату / отменить / исправить фактическую дату
      description: '`{"status": "paid", "paid_date": "2026-10-20"}` — оплачено (дата по умолчанию — сегодня). `{"status":
        "unpaid"}` — отмена, фактическая дата очищается. Срок (`due_date`) не меняется.'
      operationId: patch_occurrence_api_v1_payment_occurrences__occurrence_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: occurrence_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Occurrence Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccurrencePatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccurrenceOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/payments/summary:
    get:
      tags:
      - payments
      summary: Итоги по валютам (без конвертации)
      operationId: summary_api_v1_payments_summary_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок периода не раньше
          title: From
        description: Срок периода не раньше
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Срок периода не позже
          title: To
        description: Срок периода не позже
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users:
    get:
      tags:
      - users
      summary: Пользователи (без системного админа)
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - users
      summary: Создать пользователя (роль всегда user)
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users/{user_id}:
    patch:
      tags:
      - users
      summary: Изменить пользователя (смена пароля завершает его сессии)
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - users
      summary: Удалить пользователя (сессии завершаются)
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/audit-logs:
    get:
      tags:
      - audit
      summary: Журнал действий (admin)
      description: Вход/выход, платежи, отметки оплаты, пользователи, отправки уведомлений. Новые записи сверху.
      operationId: list_audit_logs_api_v1_audit_logs_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          description: Префикс действия, например `occurrence.` или `auth.login`
          title: Action
        description: Префикс действия, например `occurrence.` или `auth.login`
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Entity Type
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Entity Id
      - name: actor_login
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Actor Login
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: С даты (в APP_TIMEZONE)
          title: From
        description: С даты (в APP_TIMEZONE)
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: По дату включительно (в APP_TIMEZONE)
          title: To
        description: По дату включительно (в APP_TIMEZONE)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AuditLogOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
        actor_login:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Login
        action:
          type: string
          title: Action
        entity_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Type
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
      type: object
      required:
      - id
      - at
      - actor_user_id
      - actor_login
      - action
      - entity_type
      - entity_id
      - before
      - after
      - ip
      - user_agent
      title: AuditLogOut
    AuditLogPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
      type: object
      required:
      - items
      - total
      - page
      - page_size
      title: AuditLogPage
    Body_token_api_v1_auth_token_post:
      properties:
        grant_type:
          anyOf:
          - type: string
            pattern: ^password$
          - type: 'null'
          title: Grant Type
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
        scope:
          type: string
          title: Scope
          default: ''
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
        client_secret:
          anyOf:
          - type: string
          - type: 'null'
          format: password
          title: Client Secret
      type: object
      required:
      - username
      - password
      title: Body_token_api_v1_auth_token_post
    Currency:
      type: string
      enum:
      - RUB
      - USD
      - EUR
      title: Currency
    CurrencySummaryOut:
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        total:
