components:
  schemas:
    AuditLogOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        at:
          type: string
          format: date-time
          title: At
        actor_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Actor User Id
        actor_login:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Login
        action:
          type: string
          title: Action
        entity_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Type
        entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
        user_agent:
          anyOf:
          - type: string
          - type: 'null'
          title: User Agent
      type: object
      required:
      - id
      - at
      - actor_user_id
      - actor_login
      - action
      - entity_type
      - entity_id
      - before
      - after
      - ip
      - user_agent
      title: AuditLogOut
    AuditLogPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          type: array
          title: Items
        total:
